<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח ימי השבוע - תצוגה רחבה</title>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #fff9c4 0%, #e1f5fe 100%);
            --card-white: #ffffff;
            --accent-orange: #ffab91;
            --text-dark: #4e342e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-grad);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        h1 { font-size: 2.5rem; margin-bottom: 30px; color: #6d4c41; }

        .app-layout {
            display: flex;
            width: 95%;
            max-width: 1400px;
            justify-content: center;
            align-items: center; /* ממרכז את הגלגל מול הכרטיסיות */
            gap: 50px;
        }

        /* --- כרטיסיות (ימין) --- */
        .cards-container {
            flex: 1.5; /* מגדיל את אזור הכרטיסיות שיהיה רחב יותר */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nice-card {
            background: var(--card-white);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            border: 4px solid #f1f5f9;
            text-align: center;
        }

        .nice-card.active {
            border-color: var(--accent-orange);
            background-color: #fffde7;
            box-shadow: 0 8px 20px rgba(255,171,145,0.25);
        }

        .card-label { font-size: 1.2rem; color: #8d6e63; font-weight: bold; }
        .card-day { font-size: 2.5rem; font-weight: 900; margin: 10px 0; }

        .emoji-list {
            font-size: 2.5rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 60px;
            margin-top: 10px;
        }

        #day-select {
            width: 80%;
            font-size: 1.5rem;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid #ffccbc;
            margin: 15px 0;
            cursor: pointer;
        }

        .speaker-icon {
            background: #ffe0b2;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            border-radius: 50%;
            padding: 12px;
            transition: 0.2s;
            vertical-align: middle;
        }
        .speaker-icon:hover { transform: scale(1.1); }

        /* --- גלגל (שמאל) --- */
        .visual-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .walker-man {
            font-size: 6rem;
            margin-bottom: -10px;
            z-index: 5;
            transform: scaleX(-1);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        #the-wheel {
            width: 420px;
            height: 420px;
            border-radius: 50%;
            border: 15px solid #6d4c41;
            background: white;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .wheel-node {
            position: absolute;
            width: 100px;
            height: 60px;
            top: 50%;
            left: 50%;
            margin-left: -50px;
            margin-top: -30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            background: #f8fafc;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.5s;
        }

        .wheel-node span { font-size: 1.5rem; }
        .wheel-node.active-day {
            background: #ff7043;
            color: white;
            transform: scale(1.2);
            box-shadow: 0 5px 15px rgba(255,112,67,0.4);
        }
    </style>
</head>
<body>

    <h1>איזה יום היום?</h1>

    <div class="app-layout">
        
        <div class="cards-container">
            <div class="nice-card" id="c-yest">
                <span class="card-label">אתמול היה:</span>
                <div class="card-day" id="t-yest">-</div>
                <div class="emoji-list" id="e-yest"></div>
            </div>

            <div class="nice-card active" id="c-today">
                <div style="display: flex; justify-content: center; align-items: center; gap: 20px;">
                    <span class="card-label">היום:</span>
                    <button class="speaker-icon" onclick="speakText()">🔊</button>
                </div>
                <select id="day-select" onchange="updateAll(parseInt(this.value), false)">
                    <option value="0">יום ראשון</option>
                    <option value="1">יום שני</option>
                    <option value="2">יום שלישי</option>
                    <option value="3">יום רביעי</option>
                    <option value="4">יום חמישי</option>
                    <option value="5">יום שישי</option>
                    <option value="6">יום שבת</option>
                </select>
                <div class="emoji-list" id="e-today"></div>
            </div>

            <div class="nice-card" id="c-next">
                <span class="card-label">מחר יהיה:</span>
                <div class="card-day" id="t-next">-</div>
                <div class="emoji-list" id="e-next"></div>
            </div>
        </div>

        <div class="visual-area">
            <div class="walker-man">🚶‍♂️</div>
            <div id="the-wheel"></div>
        </div>

    </div>

    <script>
        const names = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
        const icons = ["☀️", "🌙", "🌳", "🦋", "🎈", "🕯️", "🏠🛌"];
        const wheel = document.getElementById('the-wheel');
        const angleSize = 360 / 7;
        let selectedIdx = 0;

        // בניית הגלגל
        names.forEach((n, i) => {
            const div = document.createElement('div');
            div.className = 'wheel-node';
            div.id = `node-${i}`;
            div.innerHTML = `<span>${icons[i]}</span>${n}`;
            const a = i * angleSize;
            div.style.transform = `rotate(${a}deg) translate(0, -165px) rotate(${-a}deg)`;
            div.onclick = () => {
                document.getElementById('day-select').value = i;
                updateAll(i, false);
            };
            wheel.appendChild(div);
        });

        function updateAll(idx, voice) {
            selectedIdx = idx;
            const yIdx = (idx - 1 + 7) % 7;
            const nIdx = (idx + 1) % 7;

            // עדכון שמות
            document.getElementById('t-yest').innerText = names[yIdx];
            document.getElementById('t-next').innerText = names[nIdx];

            // עדכון אימוג'ים (שבת תמיד 1)
            renderEmojis('e-yest', yIdx);
            renderEmojis('e-today', idx);
            renderEmojis('e-next', nIdx);

            // סיבוב גלגל
            const r = -idx * angleSize;
            wheel.style.transform = `rotate(${r}deg)`;

            // תיקון טקסט בגלגל
            names.forEach((_, i) => {
                const el = document.getElementById(`node-${i}`);
                const curA = i * angleSize;
                el.style.transform = `rotate(${curA}deg) translate(0, -165px) rotate(${-curA - r}deg)`;
                el.classList.toggle('active-day', i === idx);
            });

            if (voice) speakText();
        }

        function renderEmojis(id, dayI) {
            const box = document.getElementById(id);
            box.innerHTML = '';
            const count = (dayI === 6) ? 1 : (dayI + 1);
            for(let i = 0; i < count; i++) {
                const s = document.createElement('span');
                s.innerText = icons[dayI];
                box.appendChild(s);
            }
        }

        function speakText() {
            const utterance = new SpeechSynthesisUtterance("היום יום " + names[selectedIdx]);
            utterance.lang = 'he-IL';
            window.speechSynthesis.speak(utterance);
        }

        window.onload = () => {
            const todayIdx = new Date().getDay();
            document.getElementById('day-select').value = todayIdx;
            updateAll(todayIdx, false);
        };
    </script>
</body>
</html>
