<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איזה יום היום? - מיכל ערמון</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f0f9ff 0%, #fff7ed 100%);
            color: #334155;
            overflow: hidden;
        }

        /* כותרת - הקטנה קלה למניעת חיתוך */
        h1 { 
            margin: 15px 0 5px 0; 
            font-size: 2rem; 
            color: #475569; 
        }

        .main-container {
            display: flex;
            width: 95%;
            max-width: 1200px;
            height: 78vh;
            align-items: center;
            justify-content: center;
            gap: 30px;
            transform: scale(0.94);
        }

        /* --- כרטיסיות (צד ימין) --- */
        .cards-column {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: white;
            padding: 12px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 3px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card.active {
            border-color: #fb923c;
            background-color: #fefce8;
        }

        .row-style {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .label { font-size: 1.1rem; color: #64748b; font-weight: bold; min-width: 70px; }
        .arrow { font-size: 1.8rem; color: #2563eb; }
        .day-display { font-size: 2.2rem; font-weight: 900; color: #1e293b; flex: 1; text-align: right; }

        .emoji-box {
            font-size: 2rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
            min-height: 40px;
        }

        select {
            font-size: 1.4rem;
            padding: 5px;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            cursor: pointer;
        }

        .audio-btn {
            background: #ffedd5;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            border-radius: 50%;
            padding: 6px;
        }

        /* --- גלגל (צד שמאל) --- */
        .wheel-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .walker {
            font-size: 5.5rem;
            margin-bottom: -15px;
            z-index: 10;
            transform: scaleX(-1);
        }

        #wheel-element {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 12px solid #475569;
            background: white;
            position: relative;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .node {
            position: absolute;
            width: 90px;
            height: 45px;
            top: 50%;
            left: 50%;
            margin-left: -45px;
            margin-top: -22.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            background: #f1f5f9;
            border-radius: 15px;
            color: #1e293b;
        }

        .node span { font-size: 1.2rem; }

        /* תיקון: פונט שחור על רקע כתום ליום הנבחר */
        .node.selected {
            background: #fb923c !important;
            color: #000000 !important; /* שחור בולט */
            transform: scale(1.1);
        }

        footer {
            position: absolute;
            bottom: 8px;
            left: 15px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>איזה יום היום?</h1>

    <div class="main-container">
        
        <div class="cards-column">
            <div class="card" id="card-y">
                <div class="row-style">
                    <span class="label">אתמול:</span>
                    <span class="arrow">⬅️</span>
                    <div class="day-display" id="name-y">-</div>
                </div>
                <div class="emoji-box" id="emojis-y"></div>
            </div>

            <div class="card active" id="card-t">
                <div class="row-style">
                    <button class="audio-btn" onclick="speakDay()">🔊</button>
                    <span class="label">היום:</span>
                    <span class="arrow">⬅️</span>
                    <div class="day-display">
                        <select id="day-selector" onchange="updateUI(parseInt(this.value), false)">
                            <option value="0">יום ראשון</option>
                            <option value="1">יום שני</option>
                            <option value="2">יום שלישי</option>
                            <option value="3">יום רביעי</option>
                            <option value="4">יום חמישי</option>
                            <option value="5">יום שישי</option>
                            <option value="6">יום שבת</option>
                        </select>
                    </div>
                </div>
                <div class="emoji-box" id="emojis-t"></div>
            </div>

            <div class="card" id="card-n">
                <div class="row-style">
                    <span class="label">מחר:</span>
                    <span class="arrow">⬅️</span>
                    <div class="day-display" id="name-n">-</div>
                </div>
                <div class="emoji-box" id="emojis-n"></div>
            </div>
        </div>

        <div class="wheel-column">
            <div class="walker">🚶‍♂️</div>
            <div id="wheel-element"></div>
        </div>

    </div>

    <footer>
        רעיון והנחיות: מיכל ערמון | פיתוח: Gemini AI
    </footer>

    <script>
        const days = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
        const icons = ["☀️", "🌙", "🌳", "🦋", "🎈", "🕯️", "🏠🛌"];
        const wheel = document.getElementById('wheel-element');
        const deg = 360 / 7;
        let currentIdx = 0;

        days.forEach((day, i) => {
            const div = document.createElement('div');
            div.className = 'node';
            div.id = `node-${i}`;
            div.innerHTML = `<span>${icons[i]}</span>${day}`;
            const angle = i * deg;
            div.style.transform = `rotate(${angle}deg) translate(0, -165px) rotate(${-angle}deg)`;
            div.onclick = () => {
                document.getElementById('day-selector').value = i;
                updateUI(i, false);
            };
            wheel.appendChild(div);
        });

        function updateUI(idx, speak) {
            currentIdx = idx;
            const yest = (idx - 1 + 7) % 7;
            const next = (idx + 1) % 7;

            document.getElementById('name-y').innerText = days[yest];
            document.getElementById('name-n').innerText = days[next];

            renderEmoji('emojis-y', yest);
            renderEmoji('emojis-t', idx);
            renderEmoji('emojis-n', next);

            const rotation = -idx * deg;
            wheel.style.transform = `rotate(${rotation}deg)`;

            days.forEach((_, i) => {
                const node = document.getElementById(`node-${i}`);
                const a = i * deg;
                node.style.transform = `rotate(${a}deg) translate(0, -165px) rotate(${-a - rotation}deg)`;
                node.classList.toggle('selected', i === idx);
            });

            if (speak) speakDay();
        }

        function renderEmoji(id, dayI) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            const count = (dayI === 6) ? 1 : (dayI + 1);
            for(let i = 0; i < count; i++) {
                const s = document.createElement('span');
                s.innerText = icons[dayI];
                container.appendChild(s);
            }
        }

        function speakDay() {
            const msg = new SpeechSynthesisUtterance("היום יום " + days[currentIdx]);
            msg.lang = 'he-IL';
            window.speechSynthesis.speak(msg);
        }

        window.onload = () => {
            const d = new Date().getDay();
            document.getElementById('day-selector').value = d;
            updateUI(d, false);
        };
    </script>
</body>
</html>
