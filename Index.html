<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יום בשבוע - הגרסה הכי חמודה</title>
    <style>
        :root {
            --bg-color: #fdf6e3;
            --card-primary: #ffffff;
            --accent-soft: #ffb74d;
            --today-glow: #fff9c4;
            --text-color: #5d4037;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #fff9c4 0%, #e1f5fe 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            color: #795548;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .main-wrapper {
            display: flex;
            width: 95%;
            max-width: 1200px;
            justify-content: space-around;
            align-items: center;
            gap: 30px;
        }

        /* --- כרטיסיות (ימין) --- */
        .cards-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 420px;
        }

        .soft-card {
            background: var(--card-primary);
            padding: 15px 20px;
            border-radius: 35px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            border: 5px solid #fff;
            text-align: center;
            transition: all 0.4s ease;
        }

        .soft-card.active {
            border-color: var(--accent-soft);
            background-color: var(--today-glow);
            transform: scale(1.03);
        }

        .label-sm { font-size: 1rem; color: #a1887f; font-weight: bold; }
        .day-big { font-size: 2.2rem; font-weight: 800; margin: 2px 0; color: #4e342e; }

        .count-emojis {
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3px;
            min-height: 40px;
        }

        select {
            width: 90%;
            font-size: 1.3rem;
            padding: 8px;
            border-radius: 15px;
            border: 2px solid #ffccbc;
            background: white;
            cursor: pointer;
            margin: 5px 0;
            outline: none;
        }

        .voice-btn {
            background: #ffe0b2;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50%;
            padding: 8px;
            transition: 0.2s;
        }
        .voice-btn:hover { transform: scale(1.1); }

        /* --- גלגל (שמאל) --- */
        .wheel-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .walker {
            font-size: 5.5rem;
            margin-bottom: -15px;
            z-index: 5;
            /* הופך את האימוג'י שיפנה לכיוון המחר (ימינה) */
            transform: scaleX(-1);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }

        .the-actual-wheel {
            width: 440px;
            height: 440px;
            border-radius: 50%;
            border: 12px solid #8d6e63;
            background: white;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .wheel-item {
            position: absolute;
            width: 110px;
            height: 50px;
            top: 50%;
            left: 50%;
            margin-left: -55px;
            margin-top: -25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            background: #efebe9;
            border-radius: 15px;
            transition: 0.5s;
        }

        .wheel-item span { font-size: 1.2rem; }

        .wheel-item.highlight {
            background: #ff7043;
            color: white;
            transform: scale(1.2);
        }

        .controls { margin-top: 15px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <h1>איזה יום היום?</h1>

    <div class="main-wrapper">
        
        <div class="cards-area">
            <div class="soft-card" id="card-yest">
                <span class="label-sm">אתמול היה:</span>
                <div class="day-big" id="val-yest">-</div>
                <div class="count-emojis" id="emo-yest"></div>
            </div>

            <div class="soft-card active" id="card-today">
                <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
                    <span class="label-sm">היום:</span>
                    <button class="voice-btn" onclick="sayIt()">🔊</button>
                </div>
                <select id="day-picker" onchange="refresh(parseInt(this.value), true)">
                    <option value="0">יום ראשון</option>
                    <option value="1">יום שני</option>
                    <option value="2">יום שלישי</option>
                    <option value="3">יום רביעי</option>
                    <option value="4">יום חמישי</option>
                    <option value="5">יום שישי</option>
                    <option value="6">יום שבת</option>
                </select>
                <div class="count-emojis" id="emo-today"></div>
            </div>

            <div class="soft-card" id="card-next">
                <span class="label-sm">מחר יהיה:</span>
                <div class="day-big" id="val-next">-</div>
                <div class="count-emojis" id="emo-next"></div>
            </div>
        </div>

        <div class="wheel-container">
            <div class="walker">🚶‍♂️</div>
            <div class="the-actual-wheel" id="main-wheel"></div>
            
            <div class="controls">
                <input type="checkbox" id="auto-voice" checked>
                <label for="auto-voice">השמע קול אוטומטית</label>
            </div>
        </div>

    </div>

    <script>
        const dayNames = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
        const dayEmojis = ["☀️", "🌙", "🌳", "🦋", "🎈", "🕯️", "🏠🛌"];
        const wheel = document.getElementById('main-wheel');
        const degStep = 360 / 7;
        let currentIdx = 0;

        // בניית הגלגל עם אימוג'י אחד לכל יום
        dayNames.forEach((name, i) => {
            const item = document.createElement('div');
            item.className = 'wheel-item';
            item.id = `item-${i}`;
            item.innerHTML = `<span>${dayEmojis[i]}</span>${name}`;
            
            const angle = i * degStep;
            item.style.transform = `rotate(${angle}deg) translate(0, -175px) rotate(${-angle}deg)`;
            
            item.onclick = () => {
                document.getElementById('day-picker').value = i;
                refresh(i, true);
            };
            wheel.appendChild(item);
        });

        function refresh(idx, voice) {
            currentIdx = idx;
            const len = 7;
            const yestIdx = (idx - 1 + len) % len;
            const nextIdx = (idx + 1) % len;

            // עדכון שמות בכרטיסיות
            document.getElementById('val-yest').innerText = dayNames[yestIdx];
            document.getElementById('val-next').innerText = dayNames[nextIdx];

            // עדכון מניית אימוג'ים (1 לראשון, 2 לשני...)
            drawCount('emo-yest', yestIdx);
            drawCount('emo-today', idx);
            drawCount('emo-next', nextIdx);

            // סיבוב הגלגל
            const rot = -idx * degStep;
            wheel.style.transform = `rotate(${rot}deg)`;

            // תיקון טקסט בגלגל
            dayNames.forEach((_, i) => {
                const el = document.getElementById(`item-${i}`);
                const a = i * degStep;
                el.style.transform = `rotate(${a}deg) translate(0, -175px) rotate(${-a - rot}deg)`;
                el.classList.toggle('highlight', i === idx);
            });

            if (voice && document.getElementById('auto-voice').checked) {
                sayIt();
            }
        }

        function drawCount(id, dayI) {
            const target = document.getElementById(id);
            target.innerHTML = '';
            const num = dayI + 1;
            for(let i = 0; i < num; i++) {
                const s = document.createElement('span');
                s.innerText = dayEmojis[dayI];
                target.appendChild(s);
            }
        }

        function sayIt() {
            const speech = new SpeechSynthesisUtterance("היום יום " + dayNames[currentIdx]);
            speech.lang = 'he-IL';
            speech.rate = 0.9;
            window.speechSynthesis.speak(speech);
        }

        window.onload = () => {
            const now = new Date().getDay();
            document.getElementById('day-picker').value = now;
            refresh(now, false);
        };
    </script>
</body>
</html>
