<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח ימי השבוע - מיכל ערמון</title>
    <style>
        :root {
            --bg-soft: #f8fafc;
            --accent: #ff8a65;
            --text-main: #334155;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fffde7 0%, #e0f2fe 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        h1 { margin: 10px 0; font-size: 2rem; color: #475569; }

        .main-layout {
            display: flex;
            width: 98%;
            max-width: 1300px;
            height: 82vh;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        /* --- צד ימין: כרטיסיות בסגנון קנבה --- */
        .cards-section {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 3px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card.active {
            border-color: var(--accent);
            background-color: #fff9c4;
            transform: scale(1.02);
        }

        .row-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .label { font-size: 1.2rem; color: #64748b; font-weight: bold; width: 80px; text-align: left; }
        .arrow { font-size: 2rem; color: #c62828; display: flex; align-items: center; }
        .day-display { font-size: 2.2rem; font-weight: 900; color: #1e293b; flex: 1; text-align: right; }

        .emojis {
            font-size: 2.2rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
            min-height: 40px;
        }

        select {
            font-size: 1.4rem;
            padding: 5px;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            outline: none;
            cursor: pointer;
        }

        .audio-btn {
            background: #ffe0b2;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            border-radius: 50%;
            padding: 8px;
            margin-left: 10px;
        }

        /* --- צד שמאל: גלגל --- */
        .wheel-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .walker {
            font-size: 5.5rem;
            margin-bottom: -10px;
            z-index: 10;
            transform: scaleX(-1);
        }

        #wheel {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 12px solid #475569;
            background: white;
            position: relative;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .node {
            position: absolute;
            width: 85px;
            height: 45px;
            top: 50%;
            left: 50%;
            margin-left: -42px;
            margin-top: -22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            background: #f1f5f9;
            border-radius: 12px;
            cursor: pointer;
        }

        .node span { font-size: 1.2rem; }
        .node.selected { background: #ff7043; color: white; transform: scale(1.1); }

        footer {
            padding: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>איזה יום היום?</h1>

    <div class="main-layout">
        
        <div class="cards-section">
            <div class="card" id="yest-card">
                <div class="row-layout">
                    <span class="label">אתמול:</span>
                    <span class="arrow">⬅️</span>
                    <div class="day-display" id="yest-name">-</div>
                </div>
                <div class="emojis" id="yest-emojis"></div>
            </div>

            <div class="card active" id="today-card">
                <div class="row-layout">
                    <button class="audio-btn" onclick="playAudio()">🔊</button>
                    <span class="label">היום:</span>
                    <span class="arrow">⬅️</span>
                    <div class="day-display">
                        <select id="day-picker" onchange="update(parseInt(this.value), false)">
                            <option value="0">יום ראשון</option>
                            <option value="1">יום שני</option>
                            <option value="2">יום שלישי</option>
                            <option value="3">יום רביעי</option>
                            <option value="4">יום חמישי</option>
                            <option value="5">יום שישי</option>
                            <option value="6">יום שבת</option>
                        </select>
                    </div>
                </div>
                <div class="emojis" id="today-emojis"></div>
            </div>

            <div class="card" id="next-card">
                <div class="row-layout">
                    <span class="label">מחר:</span>
                    <span class="arrow">⬅️</span>
                    <div class="day-display" id="next-name">-</div>
                </div>
                <div class="emojis" id="next-emojis"></div>
            </div>
        </div>

        <div class="wheel-section">
            <div class="walker">🚶‍♂️</div>
            <div id="wheel"></div>
        </div>

    </div>

    <footer>
        רעיון והנחיות: <b>מיכל ערמון</b> | פיתוח: <b>Gemini AI</b>
    </footer>

    <script>
        const names = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
        const icons = ["☀️", "🌙", "🌳", "🦋", "🎈", "🕯️", "🏠🛌"];
        const wheelEl = document.getElementById('wheel');
        const deg = 360 / 7;
        let currentIdx = 0;

        names.forEach((name, i) => {
            const node = document.createElement('div');
            node.className = 'node';
            node.id = `node-${i}`;
            node.innerHTML = `<span>${icons[i]}</span>${name}`;
            const a = i * deg;
            node.style.transform = `rotate(${a}deg) translate(0, -155px) rotate(${-a}deg)`;
            node.onclick = () => {
                document.getElementById('day-picker').value = i;
                update(i, false);
            };
            wheelEl.appendChild(node);
        });

        function update(idx, audio) {
            currentIdx = idx;
            const yIdx = (idx - 1 + 7) % 7;
            const nIdx = (idx + 1) % 7;

            document.getElementById('yest-name').innerText = names[yIdx];
            document.getElementById('next-name').innerText = names[nIdx];

            setEmojis('yest-emojis', yIdx);
            setEmojis('today-emojis', idx);
            setEmojis('next-emojis', nIdx);

            const rot = -idx * deg;
            wheelEl.style.transform = `rotate(${rot}deg)`;

            names.forEach((_, i) => {
                const el = document.getElementById(`node-${i}`);
                const curA = i * deg;
                el.style.transform = `rotate(${curA}deg) translate(0, -155px) rotate(${-curA - rot}deg)`;
                el.classList.toggle('selected', i === idx);
            });

            if (audio) playAudio();
        }

        function setEmojis(id, dayI) {
            const div = document.getElementById(id);
            div.innerHTML = '';
            const count = (dayI === 6) ? 1 : (dayI + 1);
            for(let i = 0; i < count; i++) {
                const s = document.createElement('span');
                s.innerText = icons[dayI];
                div.appendChild(s);
            }
        }

        function playAudio() {
            const msg = new SpeechSynthesisUtterance("היום יום " + names[currentIdx]);
            msg.lang = 'he-IL';
            window.speechSynthesis.speak(msg);
        }

        window.onload = () => {
            const d = new Date().getDay();
            document.getElementById('day-picker').value = d;
            update(d, false);
        };
    </script>
</body>
</html>
